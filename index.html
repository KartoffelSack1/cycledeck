<style>:root{
  --bg:#000000; --card:#0B0C0E; --cardb:rgba(255,255,255,.07); --card2:#1A1B20;
  --txt:#F2F3F5; --dim:#8A8A90; --dim2:#636368; --faint:#46464B;
  --blue:#3B82F6; --green:#30D158; --amber:#F5A524; --purple:#A472F0; --red:#FF5C6C;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
::placeholder{color:var(--faint)}

.app{min-height:100vh;min-height:100dvh}
.wrap{max-width:468px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 18px 120px}
.mono{font-family:var(--mono);font-variant-numeric:slashed-zero tabular-nums}
.muted{color:var(--dim)}
.sm{font-size:13px}
.center{text-align:center}
.between{display:flex;justify-content:space-between;align-items:center}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{height:1px;background:rgba(255,255,255,.06)}
.dot{width:9px;height:9px;border-radius:9px;display:inline-block;flex:none}
.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:22px}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
.eyebrow{color:var(--dim);font-size:13.5px;font-weight:500;margin-bottom:5px}
.h1{font-size:33px;font-weight:800;letter-spacing:-.7px;color:#fff;line-height:1.02}
.head-btns{display:flex;gap:10px;align-items:center}
.icon-btn{width:50px;height:50px;border-radius:14px;background:#0F1013;border:1px solid var(--cardb);
  color:#fff;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:#17181C}
.pill-btn{display:inline-flex;align-items:center;gap:7px;height:50px;padding:0 16px;border-radius:14px;
  background:#0F1013;border:1px solid var(--cardb);color:#fff;font-size:16px;font-weight:600}
.pill-btn:active{background:#17181C}

/* cards */
.card{background:var(--card);border:1px solid var(--cardb);border-radius:22px;padding:20px}
.card.tap:active{background:#101114}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card.sq{min-height:132px}
.label{color:var(--dim);font-size:14px;font-weight:600;letter-spacing:.1px}
.label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.link{color:#fff;font-size:14px;font-weight:600}
.link.big{font-size:17px;font-weight:700;margin-top:8px}

/* active protocols (home) */
.proto-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.proto-name{font-size:19px;font-weight:600;letter-spacing:-.2px;color:#fff}
.proto-dose{font-family:var(--mono);font-variant-numeric:slashed-zero;font-size:15px;color:var(--dim);margin-top:3px}
.proto-dose b{color:#fff;font-weight:700}
.proto-day{font-family:var(--mono);font-variant-numeric:slashed-zero;font-size:14px;color:var(--dim2)}

/* next dose / bodyweight */
.nd-name{font-size:15px;font-weight:600;margin-top:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.nd-time{font-size:34px;font-weight:700;letter-spacing:-1px;margin-top:6px;color:#fff}
.bw-num{font-size:44px;font-weight:700;letter-spacing:-2px;margin-top:22px;line-height:1;color:#fff}

/* active levels */
.lvl-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lvl-name{flex:0 0 42%;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;height:8px;background:rgba(255,255,255,.10);border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;transition:width .4s}
.lvl-pct{font-size:16px;font-weight:700;width:48px;text-align:right}

/* week strip */
.week{display:flex;justify-content:space-between;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:9px;flex:1}
.wd-l{color:var(--dim2);font-size:13px;font-weight:600}
.wd-dot{width:9px;height:9px;border-radius:9px;background:rgba(255,255,255,.14)}
.wd-dot.wd-today{background:var(--green);box-shadow:0 0 8px rgba(48,209,88,.6)}
.wd-dot.wd-has{background:rgba(255,255,255,.55)}
.wd-n{color:var(--dim2);font-size:15px;font-family:var(--mono);font-variant-numeric:slashed-zero}
.wd-n.wd-n-on{color:#fff;font-weight:700}

/* mini cards */
.mini-empty{margin-top:26px}
.mini-empty .muted{font-size:14px}
.mini-empty .link{margin-top:4px}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--cardb);
  border-radius:11px;padding:9px 13px;font-size:14px;font-weight:600;color:var(--dim)}
.chip-on{background:var(--card2);color:#fff;border-color:var(--card2)}
.chip:active{opacity:.7}

/* split card (calculator/inventory) */
.split-card{display:flex;background:var(--card);border:1px solid var(--cardb);border-radius:22px;overflow:hidden}
.split-half{flex:1;padding:20px;min-height:118px}
.split-half:active{background:#101114}
.split-div{width:1px;background:rgba(255,255,255,.07)}
.split-top{display:flex;justify-content:space-between;align-items:center;color:var(--dim);margin-bottom:14px;height:24px}
.split-chev{opacity:.7}
.fx{font-family:var(--mono);font-style:italic;font-size:19px;color:var(--dim)}
.split-title{font-size:19px;font-weight:600;color:#fff}

/* stat cards */
.card.stat{padding:20px;min-height:150px}
.stat-num{font-size:52px;font-weight:700;color:#fff;margin-top:18px;letter-spacing:-1px}

/* protocol cards (stacks) */
.proto-card{padding:18px}
.proto-card-top{display:flex;align-items:center;gap:12px}
.proto-card .proto-day{margin-left:auto}
.dots{padding:2px 4px}
.freq{font-size:16px;color:#fff;margin-top:3px}
.log-btn{color:var(--blue);font-size:17px;font-weight:600;padding:6px 4px}
.log-btn:active{opacity:.6}

/* timeline (planned) */
.timeline{position:relative;padding-left:26px}
.timeline:before{content:"";position:absolute;left:6px;top:6px;bottom:20px;width:2px;background:rgba(255,255,255,.10)}
.tl-node{position:relative;display:flex;align-items:center;gap:12px;margin-bottom:18px}
.tl-dot{position:absolute;left:-26px;width:13px;height:13px;border-radius:13px;background:#555;border:3px solid #000;box-sizing:content-box;margin-left:-1px}
.tl-today{background:var(--green);box-shadow:0 0 10px rgba(48,209,88,.5)}
.tl-today-lbl{color:var(--green);font-size:13px;font-weight:700;letter-spacing:1.2px}
.tl-item{position:relative;margin-bottom:20px}
.tl-card{padding:18px}
.tl-card:active{background:#101114}

/* segmented controls */
.seg3,.seg4{display:flex;gap:4px}
.seg-item{flex:1;text-align:center;padding:11px 6px;border-radius:10px;font-size:15px;font-weight:600;color:var(--dim);background:transparent}
.seg-on{background:var(--card2);color:#fff}

/* search / notes */
.search{display:flex;align-items:center;gap:10px;padding:4px 2px}
.search-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:17px}
.card.empty{padding:26px;text-align:center}
.card.empty:active{background:#101114}
.note-card{padding:16px;margin-bottom:12px}
.note-card:active{background:#101114}
.note-title{font-size:17px;font-weight:700;color:#fff}
.note-body{color:var(--dim);font-size:14px;margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border-radius:7px;padding:3px 8px;font-size:12px;font-weight:600;color:var(--dim)}

/* insights */
.ins-title{font-size:17px;font-weight:700;color:#fff}
.ins-sub{font-family:var(--mono);font-variant-numeric:slashed-zero;font-size:17px;color:var(--dim);margin-top:4px}
.minmax{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.mm{background:var(--card2);border-radius:10px;padding:8px 12px;font-size:13px}
.mm b{color:#fff;margin-left:4px}
.notenough{text-align:center;color:var(--dim2);padding:60px 0;font-size:15px}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:2px;padding:0 4px}
.lab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.lab-v{font-size:16px;font-weight:700;color:#fff}

/* tab bar */
.tabbar-wrap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:center;pointer-events:none;z-index:20}
.tabbar{pointer-events:auto;display:flex;gap:6px;width:min(88vw,360px);background:rgba(18,18,20,.72);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);
  border-radius:30px;padding:9px 10px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;padding:11px 0;border-radius:22px;color:var(--dim2)}
.tab-on{color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);
  background:rgba(28,28,30,.95);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:14px;font-weight:600;
  padding:11px 18px;border-radius:14px;z-index:40;backdrop-filter:blur(10px)}

/* sheets / modals */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);z-index:50;
  display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:468px;background:#0C0D0F;border-top:1px solid rgba(255,255,255,.1);
  border-radius:26px 26px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 28px);
  max-height:92vh;max-height:92dvh;overflow-y:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.sheet-head h2{margin:0;font-size:21px;font-weight:700;color:#fff}
.x{width:36px;height:36px;border-radius:12px;background:#17181C;border:1px solid var(--cardb);color:var(--dim);display:grid;place-items:center}
.xmini{color:var(--faint);padding:6px;display:grid;place-items:center}

/* forms */
.field{margin-bottom:16px}
.field-label{color:var(--dim);font-size:13px;font-weight:500;margin-bottom:7px}
.input{width:100%;background:#000;border:1px solid var(--cardb);border-radius:12px;padding:12px 14px;color:#fff;font-size:16px;outline:none}
.input:focus{border-color:rgba(255,255,255,.22)}
select.input{-webkit-appearance:none;appearance:none}
.ta{height:88px;resize:none}
.ta.tall{height:120px}
.big-input{font-size:24px}
.row2{display:flex;gap:12px}
.row3{display:flex;gap:10px}
.days{display:flex;gap:6px}
.day{flex:1;height:42px;border-radius:11px;border:1px solid var(--cardb);font-size:14px;font-weight:700;color:var(--dim);background:transparent}
.day-on{color:#000}
.primary{width:100%;background:#fff;color:#000;border-radius:14px;padding:15px;font-size:16px;font-weight:700;margin-top:6px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.primary:active{opacity:.85}
.danger{width:100%;background:transparent;color:var(--red);border:1px solid var(--cardb);border-radius:14px;padding:13px;font-size:14px;font-weight:600;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.mini{background:#17181C;border:1px solid var(--cardb);color:#fff;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.mini.full{width:100%;margin-top:4px}
.msg{text-align:center;font-size:13px;font-weight:600;margin-top:12px}
.msg.ok{color:var(--green)} .msg.bad{color:var(--red)}

/* profile */
.sub-card{background:var(--card2);border-radius:18px;padding:18px;margin-bottom:16px}
.sub-title{font-size:22px;font-weight:800;color:#fff;margin-top:4px}
.unlocked{width:34px;height:34px;border-radius:34px;background:var(--green);color:#000;display:grid;place-items:center;font-weight:800}
.stat3{display:flex;align-items:center;background:var(--card);border:1px solid var(--cardb);border-radius:18px;padding:20px 0;margin-bottom:16px}
.s3{flex:1;text-align:center}
.s3n{font-size:30px;font-weight:700;color:#fff}
.s3l{color:var(--dim2);font-size:12px;font-weight:700;letter-spacing:1px;margin-top:4px}
.s3sep{width:1px;height:40px;background:rgba(255,255,255,.08)}
.group{background:var(--card);border:1px solid var(--cardb);border-radius:18px;padding:16px 16px 6px;margin-bottom:16px}
.glabel{color:var(--dim);font-size:13px;font-weight:600;margin-bottom:10px}
.grow{display:flex;align-items:center;gap:14px;padding:12px 0}
.grow:active{opacity:.6}
.gic{width:24px;color:#fff;display:grid;place-items:center}
.gtext{flex:1}
.gt{font-size:17px;font-weight:600;color:#fff}
.ghr{height:1px;background:rgba(255,255,255,.06)}
.unit-pill{background:var(--card2);border-radius:9px;padding:8px 12px;font-family:var(--mono);font-size:15px;color:#fff}
.danger-row .gic{color:var(--red)}

/* blood / inventory / calc / snapshot / history rows */
.blood-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.blood-l{flex:1;font-size:14px;min-width:0}
.bv{width:88px;padding:10px;text-align:left}
.bu{width:74px;padding:10px 8px;font-size:13px;color:var(--dim)}
.tag-input{display:flex;gap:8px}
.calc-out{background:var(--card2);border-radius:14px;padding:16px;margin-top:6px}
.calc-line{display:flex;justify-content:space-between;align-items:center;padding:7px 0}
.calc-v{font-size:17px;font-weight:700;color:#fff}
.inv-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.snap-row,.hist-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}

/* ---- v2 additions ---- */
.fbadge{display:inline-flex;align-items:center;gap:4px;background:#17181C;border:1px solid var(--cardb);border-radius:6px;padding:2px 6px;font-size:11px;font-weight:600;color:var(--dim);vertical-align:2px;white-space:nowrap}
.period-h{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
.today-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.today-name{flex:1;min-width:0;font-size:16px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-dose{font-size:14px;color:var(--dim);white-space:nowrap}
.today-dose b{color:#fff}
.legend{display:flex;gap:16px;margin-top:12px;margin-bottom:-4px}
.lg-i{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
.lg-d{width:9px;height:9px;border-radius:9px}
.lib{margin-bottom:16px}
.lib-toggle{width:100%;display:flex;align-items:center;gap:8px;justify-content:center;background:#17181C;border:1px solid var(--cardb);border-radius:12px;padding:12px;color:#fff;font-size:14px;font-weight:600}
.lib-body{margin-top:10px}
.sm-search{background:#000;border:1px solid var(--cardb);border-radius:12px;padding:6px 12px;margin-bottom:8px}
.lib-list{max-height:260px;overflow-y:auto;border:1px solid var(--cardb);border-radius:12px}
.lib-item{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.05);text-align:left}
.lib-item:last-child{border-bottom:none}
.lib-item:active{background:#141518}
.lib-name{font-size:15px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-card{background:#000;border:1px solid var(--cardb);border-radius:16px;padding:16px;margin-bottom:12px}
.inv-name{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;color:#fff}
.inv-rem{font-size:26px;font-weight:700;color:#fff;margin-top:10px}
.add-inv{background:#000;border:1px solid var(--cardb);border-radius:16px;padding:16px;margin-top:4px}
.wk-day{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.wk-day:last-child{border-bottom:none}
.wk-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.wk-name{font-size:16px;font-weight:700;color:var(--dim)}
.wk-name.wk-today{color:#fff}
.wk-date{color:var(--dim2);font-size:13px}
.wk-item{display:flex;align-items:center;gap:10px;padding:4px 0}
.wk-comp{font-size:15px;color:#fff}
.wk-item .muted{margin-left:auto}
.wk-rest{color:var(--faint);font-size:14px;padding:2px 0}
</style>
</head>

/* helpers */
const now = () => Date.now();
const startOfDay = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fmtLong = (t) => new Date(t).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
const fmtShort = (t) => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const fmtDM = (t) => { const d = new Date(t); return ("0" + d.getDate()).slice(-2) + "." + ("0" + (d.getMonth() + 1)).slice(-2); };
const uid = (p) => (p || "id") + Math.random().toString(36).slice(2, 8);
const formOf = (p) => p.form || (p.cls === "ai" ? "tablet" : "injection");
const groupOf = (p) => FORMS[formOf(p)]?.group || "Other";
const periodOf = (p) => { if (p.period) return p.period; if (p.time) { const h = +p.time.split(":")[0]; return h < 11 ? "morning" : h < 16 ? "noon" : "evening"; } return "morning"; };
const dayN = (p) => Math.max(1, Math.floor((now() - (p.start || now())) / DAY) + 1);
const kgTo = (kg, u) => (u === "lbs" ? kg * 2.20462 : kg);
const toKg = (v, u) => (u === "lbs" ? v / 2.20462 : v);

function scheduledDoses(p, from, until) {
  const out = []; const hh = PERIODS[periodOf(p)].hour;
  let d = startOfDay(from);
  while (d <= until) { if ((p.days || []).includes(new Date(d).getDay())) { const t = d + hh * 3600 * 1000; if (t >= from && t <= until) out.push(t); } d += DAY; }
  return out;
}
function levelAt(p, doses, t) { const H = (p.halflife || 4) * DAY; let s = 0; for (const dt of doses) if (dt <= t) s += (p.dose || 1) * Math.pow(2, -(t - dt) / H); return s; }
function saturation(p) {
  const H = p.halflife || 4, t = now(), win = Math.max(30, H * 6) * DAY, from = t - win;
  const doses = scheduledDoses(p, from - win, t); const cur = levelAt(p, doses, t); let peak = 0;
  for (let x = from; x <= t; x += DAY / 4) peak = Math.max(peak, levelAt(p, doses, x));
  return peak > 0 ? Math.min(100, Math.round((cur / peak) * 100)) : 0;
}
function weekDays() { const t = startOfDay(now()), sun = t - new Date(t).getDay() * DAY; return Array.from({ length: 7 }, (_, i) => sun + i * DAY); }
function weekDaysMon() { const t = startOfDay(now()), dow = (new Date(t).getDay() + 6) % 7, mon = t - dow * DAY; return Array.from({ length: 7 }, (_, i) => mon + i * DAY); }

/* persistence */
const KEY = "cycledeck_v1";
const load = () => { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch { return null; } };
const persist = (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };

function seed() {
  const s = startOfDay(now() - 47 * DAY);
  return {
    units: "kg", goalWeight: 74, openDays: [startOfDay(now())], recordStreak: 1,
    protocols: [
      { id: "p_test", name: "Testosterone Enanthate", cls: "androgen", form: "injection", dose: 250, unit: "mg", halflife: 4.5, days: [1, 4], period: "morning", status: "active", start: s },
      { id: "p_reta", name: "Retatrutide", cls: "glp", form: "injection", dose: 6, unit: "mg", halflife: 6, days: [0], period: "evening", status: "active", start: s },
      { id: "p_arim", name: "Anastrozole", cls: "ai", form: "tablet", dose: 0.5, unit: "mg", halflife: 2, days: [1, 3, 5], period: "morning", status: "active", start: s },
      { id: "p_ghk", name: "GHK-Cu", cls: "cosmetic", form: "injection", dose: 2, unit: "mg", halflife: 0.12, days: ALL, period: "evening", status: "active", start: s },
      { id: "p_mt1", name: "Melanotan I", cls: "cosmetic", form: "injection", dose: 0.5, unit: "mg", halflife: 0.05, days: ALL, period: "evening", status: "active", start: s },
    ],
    doseLogs: [],
    weights: [],
    bp: [], notes: [], snapshots: [], inventory: [], bloodwork: { date: "", markers: {}, custom: [] },
  };
}
function migrate(s) {
  s.units = s.units || "kg";
  s.protocols = (s.protocols || []).map((p) => ({ ...p, form: formOf(p), period: periodOf(p), status: p.status || "active", start: p.start || startOfDay(now()) }));
  s.doseLogs = (s.doseLogs || []).map((l) => ({ ...l }));
  s.weights = s.weights || []; s.bp = s.bp || []; s.notes = s.notes || []; s.snapshots = s.snapshots || [];
  s.inventory = (s.inventory || []).filter((i) => i.protocolId); // new shape only
  s.bloodwork = s.bloodwork || { date: "", markers: {}, custom: [] };
  s.openDays = s.openDays || []; s.recordStreak = s.recordStreak || 0; if (s.goalWeight === undefined) s.goalWeight = null;
  return s;
}

function App() {
  const [state, setState] = useState(null);
  const [tab, setTab] = useState("home");
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState("");
  const tref = useRef(0);

  useEffect(() => {
    let s = load(); s = s ? migrate(s) : seed();
    const today = startOfDay(now());
    if (!(s.openDays || []).map(startOfDay).includes(today)) s.openDays = [...(s.openDays || []), today];
    setState(s); persist(s);
  }, []);

  const save = (patch) => setState((prev) => { const next = typeof patch === "function" ? patch(prev) : { ...prev, ...patch }; persist(next); return next; });
  const flash = (m) => { setToast(m); clearTimeout(tref.current); tref.current = setTimeout(() => setToast(""), 1600); };

  if (!state) return html`<div class="wrap" style=${{ paddingTop: 140, textAlign: "center", color: "var(--dim)" }}>Loading…</div>`;

  const active = state.protocols.filter((p) => p.status === "active");
  const planned = state.protocols.filter((p) => p.status === "planned");
  const streak = (() => { const set = new Set((state.openDays || []).map(startOfDay)); let n = 0, d = startOfDay(now()); while (set.has(d)) { n++; d -= DAY; } return n; })();

  const logDose = (p) => {
    const today = startOfDay(now());
    save((s) => ({ ...s, doseLogs: [...s.doseLogs, { id: uid("d"), protocolId: p.id, t: now(), dose: p.dose, unit: p.unit }], openDays: s.openDays.map(startOfDay).includes(today) ? s.openDays : [...s.openDays, today] }));
    flash("Logged " + p.name.split(" ")[0]);
  };

  const ctx = { state, save, flash, active, planned, streak, setModal, setTab, tab, logDose };
  return html`

}

function FormBadge({ form }) {

function LevelChart({ p }) {
  const t = now(), H = p.halflife || 4, back = Math.max(21, H * 5) * DAY, from = t - back, fwd = H * 3 * DAY;
  const doses = scheduledDoses(p, from - back, t), step = (back + fwd) / 120; const pts = []; let maxY = 0;
  for (let x = from; x <= t + fwd; x += step) { const y = levelAt(p, doses, x); maxY = Math.max(maxY, y); pts.push({ x, y }); }
  maxY = maxY || 1; const W = 340, Hh = 118, pad = 4, col = CLS[p.cls].color;
  const sx = (x) => pad + ((x - from) / (t + fwd - from)) * (W - pad * 2);
  const sy = (y) => Hh - pad - (y / maxY) * (Hh - pad * 2 - 6);
  const past = pts.filter((q) => q.x <= t), fut = pts.filter((q) => q.x >= t);
  const ln = (a) => a.map((q, i) => (i ? "L" : "M") + sx(q.x).toFixed(1) + "," + sy(q.y).toFixed(1)).join(" ");
  const area = past.length ? ln(past) + ` L${sx(past[past.length - 1].x).toFixed(1)},${Hh - pad} L${sx(past[0].x).toFixed(1)},${Hh - pad} Z` : "";
  return html`<svg viewBox="0 0 ${W} ${Hh}" width="100%" style=${{ display: "block", marginTop: 6 }}>
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color=${col} stop-opacity="0.30"/><stop offset="100%" stop-color=${col} stop-opacity="0.02"/></linearGradient></defs>
    ${area && html`<path d=${area} fill="url(#lg)"/>`}
    <path d=${ln(past)} fill="none" stroke=${col} stroke-width="2.4" stroke-linejoin="round"/>
    <path d=${ln(fut)} fill="none" stroke=${col} stroke-width="2.2" stroke-dasharray="5 5" opacity="0.5"/>
    <line x1=${sx(t)} y1=${pad} x2=${sx(t)} y2=${Hh - pad} stroke="rgba(255,255,255,.18)" stroke-width="1" stroke-dasharray="3 4"/>
  </svg>`;
}

/* ============================ INSIGHTS ======================== */
function Insights({ state, setModal }) {
  const u = state.units; const [range, setRange] = useState(30);
  const cutoff = range === 0 ? -Infinity : startOfDay(now()) - (range - 1) * DAY;
  const wAll = [...state.weights].sort((a, b) => a.t - b.t); const w = wAll.filter((x) => x.t >= cutoff);
  const wv = w.map((x) => kgTo(x.kg, u)); const wcur = wAll.length ? kgTo(wAll[wAll.length - 1].kg, u) : null;
  const wf = w.length ? wv[0] : null; const wdl = wcur != null && wf != null ? +(wcur - wf).toFixed(1) : null;
  const wmin = wv.length ? Math.min(...wv) : null, wmax = wv.length ? Math.max(...wv) : null, wavg = wv.length ? wv.reduce((a, b) => a + b, 0) / wv.length : null;
  const bpAll = [...state.bp].sort((a, b) => a.t - b.t); const bp = bpAll.filter((x) => x.t >= cutoff); const lbp = bpAll[bpAll.length - 1];
  const measured = countMeasured(state.bloodwork);
  return html`
    <div class="head"><div><div class="eyebrow">Insights</div><div class="h1">Track your metrics</div></div></div>
    <div class="card">
      <div class="label" style=${{ marginBottom: 8 }}>Time Range</div>
      <div class="seg4">${[[30, "30D"], [90, "90D"], [365, "1Y"], [0, "Lifetime"]].map(([k, l]) => html`<button key=${k} class="seg-item ${range === k ? "seg-on" : ""}" onClick=${() => setRange(k)}>${l}</button>`)}</div>
    </div>

    <div class="card" style=${{ marginTop: 14 }}>
      <div class="between"><div class="ins-title">Bodyweight</div><button class="mini" onClick=${() => setModal({ type: "weight" })}>${Ic.plusS} Log</button></div>
      <div class="ins-sub">${wcur != null ? wcur.toFixed(1) + " " + u : "—"} ${wdl != null ? html`<span style=${{ color: wdl < 0 ? "#30D158" : wdl > 0 ? "#F5A524" : "var(--dim)" }}>${wdl > 0 ? "+" : ""}${wdl}</span>` : ""}</div>
      ${wv.length ? html`<div class="minmax"><span class="mm"><span class="muted sm">Min</span> <b class="mono">${wmin.toFixed(1)}</b></span><span class="mm"><span class="muted sm">Avg</span> <b class="mono">${wavg.toFixed(1)}</b></span><span class="mm"><span class="muted sm">Max</span> <b class="mono">${wmax.toFixed(1)}</b></span></div>` : ""}
      ${w.length >= 2 ? html`<${LineChart} series=${[{ data: w.map((d) => ({ t: d.t, v: kgTo(d.kg, u) })), color: "#3B82F6", area: true }]} goal=${state.goalWeight ? kgTo(state.goalWeight, u) : null} goalLabel=${"goal " + (state.goalWeight ? kgTo(state.goalWeight, u).toFixed(0) : "")} />` : html`<div class="notenough">Not enough data</div>`}
    </div>

    <div class="card" style=${{ marginTop: 14 }}>
      <div class="between"><div class="ins-title">Blood Pressure</div><button class="mini" onClick=${() => setModal({ type: "bp" })}>${Ic.plusS} Log</button></div>
      <div class="ins-sub">${lbp ? lbp.sys + "/" + lbp.dia + " mmHg" : "—"}</div>
      ${bp.length >= 2 ? html`<div class="legend"><span class="lg-i"><span class="lg-d" style=${{ background: "#FF5C6C" }}></span>Systolic</span><span class="lg-i"><span class="lg-d" style=${{ background: "#3B82F6" }}></span>Diastolic</span></div>
        <${LineChart} series=${[{ data: bp.map((d) => ({ t: d.t, v: d.sys })), color: "#FF5C6C" }, { data: bp.map((d) => ({ t: d.t, v: d.dia })), color: "#3B82F6" }]} />`
        : html`<div class="notenough">${bp.length === 1 ? "Log one more reading for a trend" : "No readings yet"}</div>`}
    </div>

    ${measured > 0 && html`<div class="card" style=${{ marginTop: 14 }}>
      <div class="ins-title">Latest labs ${state.bloodwork.date ? html`<span class="muted sm">· ${fmtShort(new Date(state.bloodwork.date).getTime())}</span>` : ""}</div>
      <div class="lab-grid" style=${{ marginTop: 12 }}>${labList(state.bloodwork).map((m, i) => html`<div key=${i}><div class="muted sm ellip">${m.label}</div><div class="mono lab-v">${m.v} <span class="muted sm">${m.u}</span></div></div>`)}</div>
    </div>`}
    <div class="foot"></div>`;
}

function LineChart({ series, goal, goalLabel }) {
  const W = 340, Hh = 150, px = 6, pt = 12, pb = 18;
  const all = series.flatMap((s) => s.data.map((d) => d.v)).filter((v) => v != null);
  if (all.length < 1) return null;
  let mn = Math.min(...all), mx = Math.max(...all); if (goal != null) { mn = Math.min(mn, goal); mx = Math.max(mx, goal); }
  const pd = ((mx - mn) || 1) * 0.18 + 0.3; mn -= pd; mx += pd;
  const ts = series.flatMap((s) => s.data.map((d) => d.t)); const x0 = Math.min(...ts), x1 = Math.max(...ts), rx = (x1 - x0) || 1;
  const sx = (x) => px + ((x - x0) / rx) * (W - px * 2); const sy = (v) => pt + (1 - (v - mn) / (mx - mn)) * (Hh - pt - pb);
  return html`<div style=${{ marginTop: 14 }}>
    <svg viewBox="0 0 ${W} ${Hh}" width="100%" style=${{ display: "block" }}>
      <defs><linearGradient id="ln0" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color=${series[0].color} stop-opacity="0.24"/><stop offset="100%" stop-color=${series[0].color} stop-opacity="0.01"/></linearGradient></defs>
      ${goal != null && html`<line x1=${px} y1=${sy(goal)} x2=${W - px} y2=${sy(goal)} stroke="#30D158" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>`}
      ${goal != null && goalLabel && html`<text x=${W - px} y=${sy(goal) - 4} text-anchor="end" font-size="9" fill="#30D158" font-family="monospace">${goalLabel}</text>`}
      ${series.map((s, si) => { const P = s.data.map((d) => ({ x: sx(d.t), y: sy(d.v) })); const ln = P.map((q, i) => (i ? "L" : "M") + q.x.toFixed(1) + "," + q.y.toFixed(1)).join(" ");
        const area = s.area ? ln + ` L${P[P.length - 1].x.toFixed(1)},${Hh - pb} L${P[0].x.toFixed(1)},${Hh - pb} Z` : "";
        return html`<g key=${si}>${s.area && html`<path d=${area} fill="url(#ln0)"/>`}<path d=${ln} fill="none" stroke=${s.color} stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${P.map((q, i) => html`<circle key=${i} cx=${q.x} cy=${q.y} r=${i === P.length - 1 ? 3.4 : 1.8} fill=${s.color}/>`)}</g>`; })}
    </svg>
    <div class="axis"><span>${fmtShort(x0)}</span><span>${fmtShort(x1)}</span></div>
  </div>`;
}

/* ============================ MODALS ========================= */
function countMeasured(bw) { if (!bw) return 0; let n = 0; for (const [k] of BLOOD) if (bw.markers?.[k]?.v?.trim?.()) n++; for (const c of (bw.custom || [])) if (c.v?.trim?.()) n++; return n; }
function labList(bw) { const out = []; for (const [k, label, du] of BLOOD) { const e = bw.markers?.[k]; if (e?.v?.trim?.()) out.push({ label, v: e.v, u: e.u || du }); } for (const c of (bw.custom || [])) if (c.v?.trim?.()) out.push({ label: c.name || "—", v: c.v, u: c.u || "" }); return out; }
function invRemaining(item, doseLogs) { const used = doseLogs.filter((l) => l.protocolId === item.protocolId && l.t >= (item.stockedAt || 0)).reduce((s, l) => s + (l.dose || 0), 0); return (item.stockedAmount || 0) - used; }

function Modals(props) {

  if (t === "add") return html`<${AddCompound} ...${props} />`;

  if (t === "blood") return html`<${BloodModal} ...${props} />`;
  if (t === "note") return html`<${NoteModal} ...${props} />`;
  if (t === "calc") return html`<${Calc} ...${props} />`;
  if (t === "inventory") return html`<${Inventory} ...${props} />`;
  if (t === "snapshot") return html`<${SnapshotModal} ...${props} />`;
  if (t === "history") return html`<${DoseHistory} ...${props} />`;
  if (t === "week") return html`<${WeekModal} ...${props} />`;
  return null;
}

function AddCompound({ modal, save, setModal }) {
  const init = modal.data || {}; const editing = !!init.id;
  const [f, setF] = useState({ id: init.id || uid("p"), name: init.name || "", cls: init.cls || "androgen", form: init.form || "injection", dose: init.dose ?? 100, unit: init.unit || "mg", halflife: init.halflife ?? 4.5, days: init.days || [1, 4], period: periodOf(init) || "morning", status: init.status || "active", start: init.start || startOfDay(now()) });
  const [startStr, setStartStr] = useState(new Date(f.start).toISOString().slice(0, 10));
  const [libQ, setLibQ] = useState(""); const [libOpen, setLibOpen] = useState(false);
  const set = (k, v) => setF((s) => ({ ...s, [k]: v }));
  const tday = (d) => setF((s) => ({ ...s, days: s.days.includes(d) ? s.days.filter((x) => x !== d) : [...s.days, d].sort((a, b) => a - b) }));
  const pick = (it) => { setF((s) => ({ ...s, name: it.name, cls: it.cls, form: it.form, dose: it.dose, unit: it.unit, halflife: it.halflife, days: it.days.slice(), period: it.period })); setLibOpen(false); setLibQ(""); };
  const valid = f.name.trim() && f.dose > 0 && f.days.length;
  const commit = () => { const rec = { ...f, start: startOfDay(new Date(startStr).getTime()) }; save((s) => ({ ...s, protocols: editing ? s.protocols.map((x) => x.id === rec.id ? rec : x) : [...s.protocols, rec] })); setModal(null); };
  const del = () => { save((s) => ({ ...s, protocols: s.protocols.filter((x) => x.id !== f.id) })); setModal(null); };
  const fIco = (k) => k === "injection" ? Ic.syringe : FORMS[k].group === "Orals" ? Ic.pill : Ic.drop;
  const matches = LIBR.filter((it) => it.name.toLowerCase().includes(libQ.toLowerCase())).slice(0, 40);
  return html`<${Sheet} title=${editing ? "Edit compound" : "Add compound"} onClose=${() => setModal(null)}>
    ${!editing && html`<div class="lib">
      <button class="lib-toggle" onClick=${() => setLibOpen(!libOpen)}>${Ic.book} Choose from library ${libOpen ? "▲" : "▼"}</button>
      ${libOpen && html`<div class="lib-body">
        <div class="search sm-search">${Ic.search}<input class="search-input" placeholder="Search compounds…" value=${libQ} onInput=${(e) => setLibQ(e.target.value)} /></div>
        <div class="lib-list">${matches.map((it) => html`<button key=${it.name} class="lib-item" onClick=${() => pick(it)}>
          <span class="dot" style=${{ background: CLS[it.cls].color }}></span>
          <div style=${{ flex: 1, minWidth: 0 }}><div class="lib-name">${it.name}</div><div class="muted sm">${FORMS[it.form].label} · t½ ${it.halflife}d</div></div>
          <span class="muted sm mono">${it.dose}${it.unit}</span></button>`)}</div>
      </div>`}
    </div>`}
    <${Field} label="Name"><input class="input" placeholder="e.g. Testosterone Enanthate" value=${f.name} onInput=${(e) => set("name", e.target.value)} /><//>
    <${Field} label="Status"><div class="chips">${[["active", "Active"], ["planned", "Planned"]].map(([k, l]) => html`<button key=${k} class="chip ${f.status === k ? "chip-on" : ""}" onClick=${() => set("status", k)}>${l}</button>`)}</div><//>
    <${Field} label="Form"><div class="chips">${Object.entries(FORMS).map(([k, v]) => html`<button key=${k} class="chip ${f.form === k ? "chip-on" : ""}" onClick=${() => set("form", k)}>${fIco(k)} ${v.label}</button>`)}</div><//>
    <${Field} label="Class (color)"><div class="chips">${Object.entries(CLS).map(([k, v]) => html`<button key=${k} class="chip ${f.cls === k ? "chip-on" : ""}" style=${f.cls === k ? { borderColor: v.color, color: v.color } : {}} onClick=${() => set("cls", k)}><span class="dot" style=${{ background: v.color }}></span>${v.label}</button>`)}</div><//>
    <div class="row3">
      <${Field} label="Dose" flex><input class="input" type="number" value=${f.dose} onInput=${(e) => set("dose", +e.target.value)} /><//>
      <${Field} label="Unit" flex><select class="input" value=${f.unit} onChange=${(e) => set("unit", e.target.value)}>${["mg", "mcg", "IU", "ml"].map((x) => html`<option key=${x}>${x}</option>`)}</select><//>
      <${Field} label="Half-life (d)" flex><input class="input" type="number" step="0.01" value=${f.halflife} onInput=${(e) => set("halflife", +e.target.value)} /><//>
    </div>
    <${Field} label="Time of day"><div class="chips">${PORDER.map((k) => html`<button key=${k} class="chip ${f.period === k ? "chip-on" : ""}" onClick=${() => set("period", k)}>${Ic[k]} ${PERIODS[k].label}</button>`)}</div><//>
    <${Field} label=${f.status === "planned" ? "Start date" : "Started on"}><input class="input" type="date" value=${startStr} onInput=${(e) => setStartStr(e.target.value)} /><//>
    <${Field} label="Dosing days"><div class="days">${DOW1.map((d, i) => html`<button key=${i} class="day ${f.days.includes(i) ? "day-on" : ""}" style=${f.days.includes(i) ? { background: CLS[f.cls].color, borderColor: CLS[f.cls].color, color: "#000" } : {}} onClick=${() => tday(i)}>${d}</button>`)}</div><//>
    <button class="primary" disabled=${!valid} style=${{ opacity: valid ? 1 : 0.4 }} onClick=${commit}>${editing ? "Save changes" : "Add compound"}</button>

}

    <div class="stat3"><div class="s3"><div class="s3n mono">${streak}</div><div class="s3l">STREAK</div></div><div class="s3sep"></div><div class="s3"><div class="s3n mono">${record}</div><div class="s3l">RECORD</div></div><div class="s3sep"></div><div class="s3"><div class="s3n mono">${doses}</div><div class="s3l">DOSES</div></div></div>

function Backup({ state, setModal }) {
  const code = useMemo(() => { try { return btoa(unescape(encodeURIComponent(JSON.stringify(state)))); } catch { return ""; } }, [state]);
  const [inp, setInp] = useState(""); const [msg, setMsg] = useState("");
  const copy = async () => { try { await navigator.clipboard.writeText(code); setMsg("Copied ✓"); } catch { setMsg("Select and copy manually"); } setTimeout(() => setMsg(""), 2200); };
  const restore = () => { try { const o = migrate(JSON.parse(decodeURIComponent(escape(atob(inp.trim()))))); persist(o); location.reload(); } catch { setMsg("Invalid code"); setTimeout(() => setMsg(""), 2200); } };
  return html`<${Sheet} title="Backup & Restore" onClose=${() => setModal(null)}>
    <div class="muted sm" style=${{ marginBottom: 12, lineHeight: 1.5 }}>Copy this code into a note to back up. Paste a code below to restore on any device.</div>
    <${Field} label="Your backup code"><textarea class="input ta" readonly onClick=${(e) => e.target.select()} value=${code}></textarea><//>
    <button class="primary" onClick=${copy}>${Ic.copy} Copy code</button>
    <div class="hr" style=${{ margin: "20px 0" }}></div>
    <${Field} label="Paste a code to restore"><textarea class="input ta" placeholder="Paste backup code…" value=${inp} onInput=${(e) => setInp(e.target.value)}></textarea><//>
    <button class="primary" disabled=${!inp.trim()} style=${{ opacity: inp.trim() ? 1 : 0.4 }} onClick=${restore}>${Ic.up} Restore</button>
    ${msg && html`<div class="msg ${msg.includes("✓") ? "ok" : "bad"}">${msg}</div>`}
  <//>`;
}

function WeightModal({ state, save, setModal }) {
  const u = state.units;
  const [v, setV] = useState("");
  const [dateStr, setDateStr] = useState(new Date().toISOString().slice(0, 10));
  const [goal, setGoal] = useState(state.goalWeight ? String(kgTo(state.goalWeight, u).toFixed(1)) : "");
  const commit = () => {
    const d = startOfDay(new Date(dateStr).getTime()); const today = startOfDay(now());
    const gkg = goal !== "" && +goal > 0 ? toKg(+goal, u) : null;
    save((s) => { let weights = s.weights; if (+v > 0) weights = [...s.weights.filter((w) => startOfDay(w.t) !== d), { t: d, kg: toKg(+v, u) }]; return { ...s, weights, goalWeight: gkg, openDays: s.openDays.map(startOfDay).includes(today) ? s.openDays : [...s.openDays, today] }; });
    setModal(null);
  };
  const del = (t) => save((s) => ({ ...s, weights: s.weights.filter((w) => w.t !== t) }));
  const hist = [...state.weights].sort((a, b) => b.t - a.t);
  return html`<${Sheet} title="Bodyweight" onClose=${() => setModal(null)}>
    <${Field} label="Date"><input class="input" type="date" value=${dateStr} onInput=${(e) => setDateStr(e.target.value)} /><//>
    <div class="row2">
      <${Field} label=${"Weight (" + u + ")"} flex><input class="input mono" style=${{ fontSize: 20 }} type="number" step="0.1" placeholder="—" value=${v} onInput=${(e) => setV(e.target.value)} /><//>
      <${Field} label=${"Goal (" + u + ")"} flex><input class="input mono" style=${{ fontSize: 20 }} type="number" step="0.1" placeholder="—" value=${goal} onInput=${(e) => setGoal(e.target.value)} /><//>
    </div>
    <button class="primary" onClick=${commit}>Save</button>
    <div class="muted sm center" style=${{ marginTop: 10 }}>Enter a weight to log it, or set an older date to backfill.</div>
    ${hist.length > 0 && html`<div style=${{ marginTop: 22 }}>
      <div class="label" style=${{ marginBottom: 10 }}>History (${hist.length})</div>
      ${hist.map((w, i) => { const nx = hist[i + 1]; const dlt = nx ? +(kgTo(w.kg, u) - kgTo(nx.kg, u)).toFixed(1) : null;

  const [m, setM] = useState(() => { const o = {}; BLOOD.forEach(([k, l, du]) => { const e = bw.markers?.[k]; o[k] = { v: e?.v || "", u: e?.u || du }; }); return o; });

    ${BLOOD.map(([k, l]) => html`<div key=${k} class="blood-row"><div class="blood-l" style=${{ color: m[k].v ? "var(--txt)" : "var(--dim)" }}>${l}</div><input class="input bv mono" placeholder="—" value=${m[k].v} onInput=${(e) => sv(k, "v", e.target.value)} /><input class="input bu" value=${m[k].u} onInput=${(e) => sv(k, "u", e.target.value)} /></div>`)}

    <button class="primary" style=${{ marginTop: 16 }} onClick=${commit}>Save bloodwork</button>

}

function NoteModal({ state, save, active, modal, setModal }) {
  const init = modal.data || {}; const editing = !!init.id;
  const [title, setTitle] = useState(init.title || ""); const [body, setBody] = useState(init.body || "");
  const [pids, setPids] = useState(init.protocolIds || []); const [tags, setTags] = useState(init.tags || []); const [tagInp, setTagInp] = useState("");
  const [dtStr, setDtStr] = useState(new Date(init.t || now()).toISOString().slice(0, 16));
  const togP = (id) => setPids((s) => s.includes(id) ? s.filter((x) => x !== id) : [...s, id]);
  const addTag = () => { const t = tagInp.trim().replace(/^#/, ""); if (t && !tags.includes(t)) setTags([...tags, t]); setTagInp(""); };
  const commit = () => { const rec = { id: init.id || uid("n"), t: new Date(dtStr).getTime(), title, body, protocolIds: pids, tags }; save((s) => ({ ...s, notes: editing ? s.notes.map((x) => x.id === rec.id ? rec : x) : [...s.notes, rec] })); setModal(null); };
  const del = () => { save((s) => ({ ...s, notes: s.notes.filter((x) => x.id !== init.id) })); setModal(null); };
  return html`<${Sheet} title=${editing ? "Edit note" : "New note"} onClose=${() => setModal(null)}>
    <${Field} label="Date & Time"><input class="input" type="datetime-local" value=${dtStr} onInput=${(e) => setDtStr(e.target.value)} /><//>
    <${Field} label="Title"><input class="input" placeholder="Title" value=${title} onInput=${(e) => setTitle(e.target.value)} /><//>
    <${Field} label="Note"><textarea class="input ta tall" placeholder="How you feel, sides, notes…" value=${body} onInput=${(e) => setBody(e.target.value)}></textarea><//>
    <${Field} label="Related protocols"><div class="chips">${active.map((p) => html`<button key=${p.id} class="chip ${pids.includes(p.id) ? "chip-on" : ""}" onClick=${() => togP(p.id)}><span class="dot" style=${{ background: CLS[p.cls].color }}></span>${p.name.split(" ")[0]}</button>`)}</div><//>
    <${Field} label="Tags"><div class="tag-input"><input class="input" style=${{ flex: 1 }} placeholder="Add tag" value=${tagInp} onInput=${(e) => setTagInp(e.target.value)} onKeyDown=${(e) => e.key === "Enter" && addTag()} /><button class="mini" onClick=${addTag}>${Ic.plus}</button></div>${tags.length > 0 && html`<div class="chips" style=${{ marginTop: 10 }}>${tags.map((t) => html`<button key=${t} class="chip" onClick=${() => setTags(tags.filter((x) => x !== t))}>#${t} ✕</button>`)}</div>`}<//>
    <button class="primary" onClick=${commit}>${editing ? "Save note" : "Save Note"}</button>
    ${editing && html`<button class="danger" onClick=${del}>${Ic.trash} Delete note</button>`}

function Calc({ setModal }) {
  const [vial, setVial] = useState(200); const [solv, setSolv] = useState(2); const [dose, setDose] = useState(250); const [du, setDu] = useState("mg");
  const conc = solv > 0 ? vial / solv : 0; const doseMg = du === "mcg" ? dose / 1000 : dose; const vol = conc > 0 ? doseMg / conc : 0; const units = vol * 100;
  return html`<${Sheet} title="Dose calculator" onClose=${() => setModal(null)}>
    <div class="muted sm" style=${{ marginBottom: 14, lineHeight: 1.5 }}>Work out how much to draw for a given dose.</div>
    <div class="row2"><${Field} label="Vial amount (mg)" flex><input class="input" type="number" value=${vial} onInput=${(e) => setVial(+e.target.value)} /><//><${Field} label="Solvent (ml)" flex><input class="input" type="number" step="0.1" value=${solv} onInput=${(e) => setSolv(+e.target.value)} /><//></div>
    <div class="row2"><${Field} label="Desired dose" flex><input class="input" type="number" value=${dose} onInput=${(e) => setDose(+e.target.value)} /><//><${Field} label="Unit" flex><select class="input" value=${du} onChange=${(e) => setDu(e.target.value)}>${["mg", "mcg"].map((x) => html`<option key=${x}>${x}</option>`)}</select><//></div>
    <div class="calc-out"><div class="calc-line"><span class="muted">Concentration</span><span class="mono calc-v">${conc.toFixed(2)} mg/ml</span></div><div class="calc-line"><span class="muted">Draw volume</span><span class="mono calc-v" style=${{ color: "#3B82F6" }}>${vol.toFixed(3)} ml</span></div><div class="calc-line"><span class="muted">On U-100 syringe</span><span class="mono calc-v" style=${{ color: "#3B82F6" }}>${units.toFixed(0)} units</span></div></div>

function Inventory({ state, save, setModal }) {
  const inv = state.inventory || []; const protos = state.protocols;
  const tracked = new Set(inv.map((i) => i.protocolId));
  const avail = protos.filter((p) => !tracked.has(p.id));
  const [addPid, setAddPid] = useState(avail[0]?.id || ""); const [amt, setAmt] = useState("");
  const addItem = () => { const p = protos.find((x) => x.id === addPid); if (!p || !(+amt > 0)) return; save((s) => ({ ...s, inventory: [...s.inventory, { id: uid("i"), protocolId: p.id, stockedAmount: +amt, stockedAt: now() }] })); setAmt(""); };
  const restock = (item) => { const cur = invRemaining(item, state.doseLogs); const v = prompt("Amount on hand now (" + (protos.find((x) => x.id === item.protocolId)?.unit || "") + "):", String(Math.max(0, Math.round(cur)))); if (v == null) return; const n = +v; if (!(n >= 0)) return; save((s) => ({ ...s, inventory: s.inventory.map((x) => x.id === item.id ? { ...x, stockedAmount: n, stockedAt: now() } : x) })); };
  const rm = (id) => save((s) => ({ ...s, inventory: s.inventory.filter((x) => x.id !== id) }));
  return html`<${Sheet} title="Inventory" onClose=${() => setModal(null)}>
    <div class="muted sm" style=${{ marginBottom: 14, lineHeight: 1.5 }}>Pick a compound you run, set how much you have. Every logged dose is subtracted automatically.</div>
    ${inv.length === 0 && html`<div class="muted center" style=${{ padding: "8px 0 16px" }}>Nothing tracked yet.</div>`}
    ${inv.map((it) => { const p = protos.find((x) => x.id === it.protocolId); if (!p) return null; const rem = invRemaining(it, state.doseLogs); const pct = it.stockedAmount > 0 ? Math.max(0, Math.min(100, (rem / it.stockedAmount) * 100)) : 0;
      const perWeek = (p.days?.length || 0) * (p.dose || 0); const daysLeft = perWeek > 0 && rem > 0 ? rem / (perWeek / 7) : null; const c = CLS[p.cls].color;
      return html`<div key=${it.id} class="inv-card">
        <div class="between"><div class="inv-name"><span class="dot" style=${{ background: c }}></span>${p.name}</div><button class="xmini" onClick=${() => rm(it.id)}>${Ic.trash}</button></div>
        <div class="inv-rem mono">${rem <= 0 ? "0" : (Math.round(rem * 10) / 10)} <span class="muted sm">${p.unit} left</span></div>
        <div class="bar" style=${{ marginTop: 8 }}><div class="bar-fill" style=${{ width: pct + "%", background: rem <= 0 ? "#FF5C6C" : c }}></div></div>
        <div class="muted sm" style=${{ marginTop: 8 }}>${rem <= 0 ? "Out of stock" : daysLeft != null ? "~" + Math.round(daysLeft) + " days left · out around " + fmtShort(now() + daysLeft * DAY) : "Add dosing days to estimate run-out"}</div>
        <button class="mini full" style=${{ marginTop: 10 }} onClick=${() => restock(it)}>${Ic.box} Update stock</button>
      </div>`; })}
    ${avail.length > 0 && html`<div class="add-inv">
      <div class="label" style=${{ marginBottom: 10, marginTop: 4 }}>Add item</div>
      <div class="row2"><select class="input" style=${{ flex: 2 }} value=${addPid} onChange=${(e) => setAddPid(e.target.value)}>${avail.map((p) => html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select><input class="input mono" style=${{ flex: 1 }} type="number" placeholder=${"total " + (protos.find((x) => x.id === addPid)?.unit || "")} value=${amt} onInput=${(e) => setAmt(e.target.value)} /></div>
      <button class="mini full" style=${{ marginTop: 8 }} onClick=${addItem}>${Ic.plus} Add to inventory</button>
    </div>`}
  <//>`;
}
